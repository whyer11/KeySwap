name: Build and Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify compiler
        shell: pwsh
        run: |
          $csc = "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found on runner" }
          "csc: " + (Get-Item $csc).VersionInfo.FileVersion

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Regression tests
        shell: pwsh
        run: ./test.ps1

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/KeySwap.exe -DestinationPath dist/KeySwap.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeySwap-exe
          path: |
            dist/KeySwap.exe
            dist/KeySwap.zip
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0." + $env:GITHUB_RUN_NUMBER
          $sha = $env:GITHUB_SHA.Substring(0, 7)

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists, re-uploading with --clobber"
            gh release upload $tag "dist/KeySwap.exe#KeySwap.exe" --clobber
            gh release upload $tag "dist/KeySwap.zip#KeySwap.zip" --clobber
          } else {
            gh release create $tag `
              "dist/KeySwap.exe#KeySwap.exe" `
              "dist/KeySwap.zip#KeySwap.zip" `
              --title "KeySwap $tag ($sha)" `
              --target $env:GITHUB_SHA `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) { throw "publishing release failed" }
          Write-Host "release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
